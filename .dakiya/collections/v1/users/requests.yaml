name: users
type: http
methods:
  - id: create
    name: Create user
    method: POST
    url: "{{baseUrl}}/api/users"
    headers:
      Content-Type: "application/json"
    body: |
      {
        "name": "{{userName}}",
        "email": "{{userEmail}}"
      }
  - id: delete
    name: Delete user
    method: DELETE
    url: "{{baseUrl}}/api/users/{{userId}}"
  - id: get
    name: Get user
    method: GET
    url: "{{baseUrl}}/api/users/{{userId}}"
  - id: list
    name: List users
    method: GET
    url: "{{baseUrl}}/api/users"
  - id: update
    name: Update user
    method: PUT
    url: "{{baseUrl}}/api/users/{{userId}}"
    headers:
      Content-Type: "application/json"
    body: |
      {
        "name": "{{userName}}",
        "email": "{{userEmail}}"
      }
